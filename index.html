<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario de Adviento 🎄</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 30px;
    }
    h1 {
      margin-bottom: 30px;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
      opacity: 0.4;
    }
    .card.active {
      opacity: 1;
      background: #c62828;
      color: white;
      font-weight: bold;
    }
    .card.disabled {
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<h1>🎄 Calendario de Adviento</h1>
<p>Abre solo el día que corresponde 💫</p>

<div class="calendar" id="calendar"></div>

<script>
  const startDay = 16;
  const endDay = 24;
  const today = new Date().getDate();
  const calendar = document.getElementById("calendar");

  for (let day = startDay; day <= endDay; day++) {
    const card = document.createElement("div");
    card.classList.add("card");

    if (day === today) {
      card.classList.add("active");
      card.innerText = `🎁 Día ${day}\nHaz clic para abrir`;
      card.onclick = () => {
  document.getElementById("modal-text").innerText =
    "🎁 Día " + day + "\n\nEste es tu regalo de hoy 💛\n\nCon Amor - Joha.";
  document.getElementById("modal").style.display = "flex";
};

    } else {
      card.classList.add("disabled");
      card.innerText = `Día ${day}`;
    }

    calendar.appendChild(card);
  }
</script>
<div id="modal" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
">
  <div style="
    background:white;
    padding:30px;
    border-radius:15px;
    max-width:400px;
    text-align:center;
  ">
    <p id="modal-text" style="white-space:pre-line;"></p>
    <button onclick="document.getElementById('modal').style.display='none'"
      style="
        margin-top:20px;
        padding:10px 20px;
        border:none;
        background:#c62828;
        color:white;
        border-radius:8px;
        cursor:pointer;
      ">
      Cerrar
    </button>
  </div>
</div>

</body>
</html>
