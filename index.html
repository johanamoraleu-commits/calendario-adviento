<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Adviento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff; /* FONDO BLANCO HOME */
      color: #333;
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 10px 0 20px;
      font-size: 1.7rem;
      text-align: center;
      color: #c1121f;
    }

    /* GRID */
    .calendar {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    /* IMÁGENES CERRADAS */
    .day-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .day-img:active {
      transform: scale(0.96);
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }

    .modal-content {
      background: white;
      color: black;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      animation: zoomFade 0.3s ease;
      overflow: hidden;
    }

    .modal-content img {
      width: 100%;
      height: auto;
      display: block;
    }

    .close {
      width: 100%;
      padding: 14px;
      border: none;
      background: #c1121f;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    @keyframes zoomFade {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* EXTRA PARA PANTALLAS PEQUEÑAS */
    @media (max-width: 360px) {
      .calendar {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <h1>🎄 ¡Feliz Navidad Lindo! 🎄</h1>

  <div class="calendar">
    <img src="contents/16.jpg" class="day-img" onclick="openCard(16)" alt="Día 16">
    <img src="contents/17.jpg" class="day-img" onclick="openCard(17)" alt="Día 17">
    <img src="contents/18.jpg" class="day-img" onclick="openCard(18)" alt="Día 18">
    <img src="contents/19.jpg" class="day-img" onclick="openCard(19)" alt="Día 19">
    <img src="contents/20.jpg" class="day-img" onclick="openCard(20)" alt="Día 20">
    <img src="contents/21.jpg" class="day-img" onclick="openCard(21)" alt="Día 21">
    <img src="contents/22.jpg" class="day-img" onclick="openCard(22)" alt="Día 22">
    <img src="contents/23.jpg" class="day-img" onclick="openCard(23)" alt="Día 23">
    <img src="contents/24.jpg" class="day-img" onclick="openCard(24)" alt="Día 24">
  </div>

  <!-- MODAL -->
  <div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <img id="cardImage" src="" alt="Tarjeta del día">
      <button class="close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script>
    function openCard(day) {
      document.getElementById("cardImage").src = `contents/card-${day}.jpg`;
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>
