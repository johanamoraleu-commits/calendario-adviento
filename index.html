<script>
 <div id="modal" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  justify-content:center;
  align-items:center;
  z-index:1000;
">
  <div style="
    background:white;
    padding:20px;
    border-radius:15px;
    max-width:420px;
    text-align:center;
  ">
    <img id="modal-img" style="width:100%; border-radius:12px;" />
    <button onclick="document.getElementById('modal').style.display='none'"
      style="
        margin-top:15px;
        padding:10px 20px;
        border:none;
        background:#c62828;
        color:white;
        border-radius:8px;
        cursor:pointer;
      ">
      Cerrar
    </button>
  </div>
</div>

</script>
