<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliez Navidad Lindurita mia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #7b2cbf, #c1121f);
      color: white;
      min-height: 100vh;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 10px 0 20px;
      font-size: 1.7rem;
      text-align: center;
    }

    /* GRID CORREGIDO */
    .calendar {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    /* IMÁGENES */
    .day-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .day-img:active {
      transform: scale(0.96);
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
