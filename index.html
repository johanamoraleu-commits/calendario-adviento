<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calendario de Adviento</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #7b2cbf, #c1121f);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      box-sizing: border-box;
      day-img {
  width: 100%;
  border-radius: 14px;
  cursor: pointer;
  transition: transform 0.25s ease;
}

.day-img:active {
  transform: scale(0.95);
}

    }

    h1 {
      margin: 10px 0 25px;
      font-size: 1.8rem;
      text-align: center;
    }

    /* CALENDARIO */
    .calendar {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 14px;
    }

    .day {
      background: rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 22px 0;
      font-size: 1.2rem;
      text-align: center;
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease;
      user-select: none;
    }

    .day:active {
      transform: scale(0.95);
      background: rgba(255,255,255,0.35);
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-content {
      background: white;
      color: black;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      animation: zoomFade 0.35s ease;
      overflow: hidden;
    }

    .modal-content img {
      width: 100%;
      display: block;
    }

    .close {
      width: 100%;
      padding: 14px;
      border: none;
      background: #c1121f;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    @keyframes zoomFade {
      from {
        transform: scale(0.85);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <h1>🎄 Feliz Navidad Lindurita mia 🎄</h1>

  <div class="calendar">
  <img src="contents/16.jpg" class="day-img" onclick="openCard(16)">
  <img src="contents/17.jpg" class="day-img" onclick="openCard(17)">
  <img src="contents/18.jpg" class="day-img" onclick="openCard(18)">
  <img src="contents/19.jpg" class="day-img" onclick="openCard(19)">
  <img src="contents/20.jpg" class="day-img" onclick="openCard(20)">
  <img src="contents/21.jpg" class="day-img" onclick="openCard(21)">
  <img src="contents/22.jpg" class="day-img" onclick="openCard(22)">
  <img src="contents/23.jpg" class="day-img" onclick="openCard(23)">
  <img src="contents/24.jpg" class="day-img" onclick="openCard(24)">
</div>

  <!-- MODAL -->
  <div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <img id="cardImage" src="" alt="Tarjeta del día">
      <button class="close" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script>
    function openCard(day) {
      document.getElementById("cardImage").src = `contents/card-${day}.jpg`;
      document.getElementById("modal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }
  </script>

</body>
</html>
